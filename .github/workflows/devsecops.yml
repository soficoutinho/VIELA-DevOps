
name: VIELA DevSecOps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Executar testes
        run: python -m pytest backend/test_main.py -v

  gitleaks:
    name: Gitleaks - Segredos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep - Analise estatica
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Executar Semgrep
        run: semgrep scan --config auto --error .

  trivy:
    name: Trivy - Imagem Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Construir imagem
        run: docker build -t viela-api:ci .

      - name: Executar Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: viela-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  publish:
    name: Publicar imagem no GHCR
    runs-on: ubuntu-latest
    needs: [tests, gitleaks, semgrep, trivy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Login no GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem
        run: |
          docker build -t ghcr.io/soficoutinho/viela-devops:latest .
          docker push ghcr.io/soficoutinho/viela-devops:latest
